# SonarQube analysis configuration.
#
# Connection details are deliberately absent: sonar.host.url and the analysis token are
# supplied by the environment (SONAR_HOST_URL / SONAR_TOKEN) so no credential and no
# machine-specific address is committed. Run with:
#   npm run coverage && sonar-scanner
sonar.projectKey=zero-paperhub
sonar.projectName=ZERO-PAPERHUB
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=src,scripts
sonar.tests=src/test

# src/test is inside src, so it must be excluded from sources or the scanner indexes it
# twice and fails. dist/ and coverage/ are generated; .claude/ and .gsd/ hold agent
# worktrees that would otherwise be analyzed as duplicate copies of this source tree.
sonar.exclusions=src/test/**,node_modules/**,dist/**,coverage/**,.claude/**,.gsd/**,.reports/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
