name: Deploy ZERO-PAPERHUB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` on the deployment group: cancelling a live Pages publish
# mid-flight can leave the site partially updated. A queued run waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # REDUCED by plan `04.2-06`, in the same commit that removed what these lines
      # described.
      #
      # Gone with it: the "Verify capability coverage" step, whose argument was a path
      # inside `.planning/` that moves to the HAOO repository under D-03 — leaving it
      # would fail this deploy on a missing path — and the four browser-prefixed build
      # variables together with the four paragraphs justifying them. Those paragraphs
      # explained why the measurement provider's values were repository variables rather
      # than secrets, and why two named report credentials were deliberately absent from
      # this environment. With no variables
      # left they described machinery that is not here, and a stale justification standing
      # in CI is a false statement in CI — the exact failure `04.1-11` fixed by restating
      # a step's comment in the same commit that changed what the step asserts.
      #
      # This workflow now sets NO browser-prefixed variable at all, and
      # `src/test/build-output.test.ts` asserts that empty set explicitly rather than
      # iterating nothing.
      - name: Build
        run: npm run build

      # `test:unit`, not `test`: `test` re-runs `build` and would overwrite the artifact
      # this job is about to upload. Running after Build is deliberate —
      # `build-output.test.ts` validates the very `dist/` that ships.
      - name: Test
        run: npm run test:unit

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4